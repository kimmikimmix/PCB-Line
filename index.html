<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCB 제조 공정 흐름도 · PCB manufacturing process flow</title>
<style>
:root{
  --board:#0A2E22; --board-2:#0E3A2B; --board-3:#124633; --edge:#1C5B44;
  --copper:#C87F4A; --copper-dim:#7A4E2E; --gold:#E0B44C;
  --silk:#EAF0EA; --silk-dim:#8FAC9D; --fr4:#C9BD82;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Consolas","D2Coding",monospace;
  --sans:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--board);color:var(--silk);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 72px}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--copper);margin:0 0 10px}
h1{font-size:27px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;line-height:1.25}
h1 .alt{color:var(--silk-dim);font-weight:400}
.lede{color:var(--silk-dim);font-size:14px;margin:0 0 26px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 24px;padding-bottom:20px;border-bottom:1px solid var(--edge)}
button{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--silk);background:var(--board-2);border:1px solid var(--edge);border-radius:3px;padding:8px 13px;cursor:pointer;transition:border-color .15s,color .15s}
button:hover{border-color:var(--copper);color:var(--copper)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--board-3)}
.seg{display:inline-flex;gap:0}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg button:last-child{border-radius:0 3px 3px 0}
.spacer{flex:1}
.count{font-family:var(--mono);font-size:12px;color:var(--silk-dim);letter-spacing:.08em;white-space:nowrap}
.count b{color:var(--gold);font-weight:600}

.mapwrap{position:relative;overflow-x:auto;padding-bottom:4px}
.map{position:relative;min-width:660px}
svg.trace{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--silk-dim);opacity:.7;margin-bottom:8px}
.floor{display:grid;grid-template-columns:36px repeat(12,1fr);gap:7px;margin-bottom:7px;position:relative;z-index:1}
.flab{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--silk-dim);border-right:1px solid var(--edge)}
.rm{position:relative;background:var(--board-2);border:1px solid var(--edge);border-radius:3px;padding:9px 8px 8px;text-align:left;cursor:pointer;font-family:var(--sans);color:inherit;transition:border-color .2s,background .2s,transform .2s;min-width:0;z-index:2}
.rm:hover{border-color:var(--copper);transform:translateY(-1px)}
.rm .tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--silk-dim);opacity:.75;display:block;margin-bottom:5px}
.rm .rko{font-size:12.5px;font-weight:600;line-height:1.25;display:block}
.rm .ren{font-size:11px;line-height:1.25;color:var(--silk-dim);display:block;margin-top:2px}
.rm .sn{position:absolute;top:7px;right:8px;font-family:var(--mono);font-size:10px;color:var(--copper);letter-spacing:.04em}
.rm.seen{border-color:var(--copper-dim)}
.rm.seen .sn{color:var(--copper)}
.rm.live{border-color:var(--gold);background:var(--board-3);box-shadow:0 0 0 1px var(--gold),0 0 18px -4px var(--gold)}
.rm.live .rko{color:var(--gold)}
.rm.live .sn{color:var(--gold)}
.rm.off{background:transparent;border:1px dashed var(--fr4);opacity:.85}
.rm.off .rko{color:var(--fr4)}
.rm.off .tag,.rm.off .ren{color:var(--fr4);opacity:.7}
.rm.off.live{background:rgba(201,189,130,.09);box-shadow:0 0 0 1px var(--gold)}
.gap{grid-column:span 4}
.gap6{grid-column:span 6}

.rail{height:2px;background:var(--edge);border-radius:2px;margin:20px 0 30px;position:relative;overflow:hidden}
.rail i{position:absolute;left:0;top:0;bottom:0;background:var(--copper);transition:width .35s ease}

.steps{display:flex;flex-direction:column;gap:2px}
.st{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:14px 14px 14px 0;border-top:1px solid var(--edge);cursor:pointer;transition:background .18s}
.st:hover{background:var(--board-2)}
.st:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.st .badge{font-family:var(--mono);font-size:13px;color:var(--silk-dim);border:1px solid var(--edge);border-radius:3px;height:30px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em;margin-left:8px}
.st.seen .badge{color:var(--copper);border-color:var(--copper-dim)}
.st.live{background:var(--board-2)}
.st.live .badge{color:var(--board);background:var(--gold);border-color:var(--gold);font-weight:700}
.st.live .h4{color:var(--gold)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.h4{font-size:16px;font-weight:600;margin:0;line-height:1.3}
.h5{font-size:13px;color:var(--silk-dim);margin:1px 0 0}
.loc{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--silk-dim);opacity:.8;white-space:nowrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px;margin-top:9px}
.cols ul{margin:0;padding-left:17px}
.cols li{font-size:13.5px;line-height:1.55;margin-bottom:2px}
.cols .en li{color:var(--silk-dim)}
.mv{font-family:var(--mono);font-size:11px;color:var(--copper);letter-spacing:.03em;margin-top:9px;display:flex;align-items:center;gap:7px}
.mv::before{content:"";width:16px;height:1px;background:var(--copper);flex:none}

body.ko .en{display:none}
body.en .ko{display:none}
body.ko .cols,body.en .cols{grid-template-columns:1fr}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--edge);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--silk-dim);opacity:.65;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media (max-width:700px){
  .wrap{padding:22px 14px 56px}
  h1{font-size:21px}
  .cols{grid-template-columns:1fr}
  .st{grid-template-columns:38px 1fr;gap:10px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

@media print{
  @page{size:A4 portrait;margin:13mm}
  body{background:#fff;color:#111;font-size:9.2pt}
  .wrap{max-width:none;padding:0}
  .bar,.rail,.foot,svg.trace{display:none!important}
  .eyebrow{color:#666}
  h1{font-size:16pt;color:#111}
  .mapwrap{overflow:visible}
  .map{min-width:0}
  .flab{color:#444;border-right:1px solid #bbb}
  .rm{background:#f4f4f0;border:.5pt solid #999;box-shadow:none!important;padding:5px 5px 4px}
  .rm .rko{color:#111;font-size:8pt}
  .rm .ren,.rm .tag{color:#666;font-size:6.5pt}
  .rm .sn{color:#111;font-size:7pt}
  .rm.live{background:#f4f4f0;border-color:#999}
  .rm.live .rko,.rm.live .sn{color:#111}
  .rm.off{border:.8pt dashed #888;background:#fff}
  .rm.off .rko{color:#333}
  .st{border-top:.5pt solid #ccc;background:none!important;page-break-inside:avoid;padding:7px 0}
  .st .badge{color:#111;border:.5pt solid #999;background:#fff!important;height:24px;font-size:9pt}
  .st.live .h4,.h4{color:#111}
  .h5,.cols .en li,.loc{color:#555}
  .cols{grid-template-columns:1fr 1fr!important}
  .cols li{font-size:8pt;line-height:1.35}
  .mv{color:#666}
  .mv::before{background:#666}
  body.ko .en,body.en .ko{display:revert}
}
</style>
</head>

<div class="wrap">

<p class="eyebrow">FLOOR LAYOUT &amp; PROCESS SEQUENCE</p>
<h1>PCB 제조 공정 흐름도 <span class="alt">/ PCB manufacturing process flow</span></h1>

      <button class="rm" data-room="dsm2" style="grid-column:span 2"><span class="tag">습식 WET</span><span class="sn">09</span><span class="rko">디스미어·디버</span><span class="ren">Desmear / deburr</span></button>

    <div class="floor">

      <button class="rm" data-room="lay1" style="grid-column:span 2"><span class="tag">기계 MECH</span><span class="sn">06</span><span class="rko">본딩·레이업</span><span class="ren">Bonding / lay-up</span></button>

      <button class="rm" data-room="trm1" style="grid-column:span 2"><span class="tag">기계 MECH</span><span class="sn">07</span><span class="rko">면취</span><span class="ren">Trimming</span></button>
      <button class="rm" data-room="drl1" style="grid-column:span 2"><span class="tag">기계 MECH</span><span class="sn">08·14B</span><span class="rko">드릴링·라우팅</span><span class="ren">Drill / rout / V-cut</span></button>
      <button class="rm" data-room="emma1" style="grid-column:span 2"><span class="tag">검사 QC</span><span class="sn">14</span><span class="rko">EMMA 검사</span><span class="ren">EMMA test</span></button>
    </div>
    <div class="floor">
      <div class="flab" style="border:0;font-size:10px">외주</div>
      <div class="gap6"></div>
      <button class="rm off" data-room="out" style="grid-column:span 6"><span class="tag">외주 OUTSOURCED</span><span class="sn">OUT</span><span class="rko">표면처리 — 협력사</span><span class="ren">Surface finish — external supplier, off site</span></button>
    </div>
  </div>
</div>

<div class="rail"><i id="railfill" style="width:0%"></i></div>

<div class="steps" id="steps"></div>

<div class="foot">

  <span>구리 트레이스 = 판넬 이동 경로 · 비아 = 층간 이송</span>
</div>

 k:["표면처리는 사내 공정이 아님 — 협력사에서 실시","솔더마스크·실크 완료 후 협력사로 출하","처리 완료 후 재입고하여 EMMA 검사로 진행"],
 e:["Surface finish is not an in-house process; a partner company performs it","Panels ship out once solder mask and legend are done","They return to the plant and go on to the EMMA test"],
 mk:"이동 협력사 → 1F 입고",me:"transfer supplier → back in at 1F"},
{n:"14",room:["emma1"],ko:"EMMA 검사",en:"EMMA electrical test",lk:"1F 우측 끝",le:"1F far right",
 k:["EMMA 기계를 이용해 검사"],
 e:["Electrical test on the EMMA machine"],
 mk:"이동 1F 내 — 드릴링실로",me:"transfer within 1F to the drilling room"},
{n:"14B",room:["drl1"],ko:"라우팅 · V-cut",en:"Routing and V-cut",lk:"1F 드릴링실",le:"1F drilling room",
 k:["드릴링실에서 실시 — 8번과 같은 방 재방문","라우팅으로 판넬에서 개별 보드 외형 가공","V-cut으로 분리선 가공","이후 같은 층에서 최종 수세"],
 e:["Done in the drilling room, the same room as step 8","Routing profiles the individual boards out of the panel","V-cut scoring for the break-apart lines","Final rinse afterwards on the same floor"],
 mk:"이동 1F → 3F",me:"transfer 1F → 3F"},
{n:"15",room:["pack3"],ko:"최종검사 · 포장",en:"Final inspection and packing",lk:"3F 좌측 끝",le:"3F far left",
 k:["최종 검사","포장 작업"],
 e:["Final inspection","Packing"],
 mk:"",me:""}

var FLOOR={office3:0,pack3:0,psr3:0,aoi2:1,exp2:1,wet2:1,dsm2:1,plt2:1,wh1:2,lay1:2,prs1:2,trm1:2,drl1:2,emma1:2,out:3};
var idx=0, timer=null, map=document.getElementById('map'), svg=null;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function buildList(){
  var h='';
  for(var i=0;i<STEPS.length;i++){
    var s=STEPS[i];
    h+='<div class="st" tabindex="0" role="button" data-i="'+i+'" aria-label="'+esc(s.n+' '+s.ko)+'">'
      +'<div class="badge">'+s.n+'</div><div>'
      +'<div class="hd"><div><p class="h4 ko">'+esc(s.ko)+'</p><p class="h4 en" style="display:none">'+esc(s.en)+'</p>'
      +'<p class="h5 ko">'+esc(s.en)+'</p></div>'
      +'<span class="loc"><span class="ko">'+esc(s.lk)+'</span> <span class="en">'+esc(s.le)+'</span></span></div>'
      +'<div class="cols"><ul class="ko">'+s.k.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'
      +'<ul class="en">'+s.e.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'
      +(s.mk?'<div class="mv"><span class="ko">'+esc(s.mk)+'</span><span class="en">'+esc(s.me)+'</span></div>':'')
      +'</div></div>';
  }
  document.getElementById('steps').innerHTML=h;
  document.getElementById('tot').textContent=STEPS.length;
  var els=document.querySelectorAll('.st');
  for(var j=0;j<els.length;j++){
    els[j].addEventListener('click',function(){go(+this.dataset.i)});
    els[j].addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go(+this.dataset.i)}});
  }
}

function fixHeadings(){
  var mode=document.body.className;
  var h5=document.querySelectorAll('.h5');
  for(var i=0;i<h5.length;i++) h5[i].style.display=(mode==='both')?'':'none';
  var enH=document.querySelectorAll('.h4.en');
  for(var k=0;k<enH.length;k++) enH[k].style.display=(mode==='en')?'':'none';
  var koH=document.querySelectorAll('.h4.ko');
  for(var m=0;m<koH.length;m++) koH[m].style.display=(mode==='en')?'none':'';
}

function anchor(id){
  var el=map.querySelector('[data-room="'+id+'"]');
  var mb=map.getBoundingClientRect(), b=el.getBoundingClientRect();
  return {x:b.left-mb.left+b.width/2, top:b.top-mb.top, bot:b.top-mb.top+b.height, w:b.width};
}

function mitre(pts,r){
  var d='M '+pts[0][0]+' '+pts[0][1];
  for(var i=1;i<pts.length-1;i++){
    var p=pts[i-1],v=pts[i],n=pts[i+1];
    var d1=Math.hypot(v[0]-p[0],v[1]-p[1]), d2=Math.hypot(n[0]-v[0],n[1]-v[1]);
    var r1=Math.min(r,d1/2), r2=Math.min(r,d2/2);
    var a=[v[0]+(p[0]-v[0])/d1*r1, v[1]+(p[1]-v[1])/d1*r1];
    var b=[v[0]+(n[0]-v[0])/d2*r2, v[1]+(n[1]-v[1])/d2*r2];
    d+=' L '+a[0]+' '+a[1]+' L '+b[0]+' '+b[1];
  }
  var L=pts[pts.length-1];
  return d+' L '+L[0]+' '+L[1];
}

function route(from,to){
  var A=anchor(from), B=anchor(to), fa=FLOOR[from], fb=FLOOR[to];
  var pts,chan;
  if(fa===fb){
    chan=A.bot+14;
    pts=[[A.x,A.bot],[A.x,chan],[B.x,chan],[B.x,B.bot]];
  }else if(fa<fb){
    chan=(A.bot+B.top)/2;
    pts=[[A.x,A.bot],[A.x,chan],[B.x,chan],[B.x,B.top]];
  }else{
    chan=(B.bot+A.top)/2;
    pts=[[A.x,A.top],[A.x,chan],[B.x,chan],[B.x,B.bot]];
  }
  return {d:mitre(pts,9), via:fa!==fb?[[A.x,fa<fb?A.bot:A.top],[B.x,fa<fb?B.top:B.bot]]:null};
}

function ns(t){return document.createElementNS('http://www.w3.org/2000/svg',t)}

function drawTrace(){
  if(svg) svg.remove();
  svg=ns('svg'); svg.setAttribute('class','trace'); svg.setAttribute('aria-hidden','true');
  map.appendChild(svg);
  var s=STEPS[idx];
  if(s.room.length>1){
    var lnk=route(s.room[0],s.room[1]);
    var p0=ns('path'); p0.setAttribute('d',lnk.d); p0.setAttribute('fill','none');
    p0.setAttribute('stroke','#7A4E2E'); p0.setAttribute('stroke-width','2'); p0.setAttribute('stroke-linejoin','round');
    svg.appendChild(p0);
  }
  if(idx>=STEPS.length-1) return;
  var exit=s.room[s.room.length-1], nxt=STEPS[idx+1].room[0];
  var r=route(exit,nxt);
  var p=ns('path'); p.setAttribute('d',r.d); p.setAttribute('fill','none');
  p.setAttribute('stroke','#C87F4A'); p.setAttribute('stroke-width','2.5');
  p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
  svg.appendChild(p);
  if(r.via){
    for(var i=0;i<r.via.length;i++){
      var o=ns('circle'); o.setAttribute('cx',r.via[i][0]); o.setAttribute('cy',r.via[i][1]);
      o.setAttribute('r','5.5'); o.setAttribute('fill','#0A2E22');
      o.setAttribute('stroke','#E0B44C'); o.setAttribute('stroke-width','2');
      svg.appendChild(o);
      var c=ns('circle'); c.setAttribute('cx',r.via[i][0]); c.setAttribute('cy',r.via[i][1]);
      c.setAttribute('r','1.6'); c.setAttribute('fill','#E0B44C');
      svg.appendChild(c);
    }
  }
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var len=p.getTotalLength();
  if(!reduce){
    p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
    p.getBoundingClientRect();
    p.style.transition='stroke-dashoffset .75s cubic-bezier(.4,0,.2,1)';
    p.style.strokeDashoffset=0;
  }
  var tok=ns('rect'); tok.setAttribute('width','11'); tok.setAttribute('height','8');
  tok.setAttribute('rx','1.5'); tok.setAttribute('fill','#E0B44C');
  svg.appendChild(tok);
  var t0=null, dur=reduce?0:750;
  function frame(ts){
    if(t0===null) t0=ts;
    var q=dur?Math.min(1,(ts-t0)/dur):1;
    var pt=p.getPointAtLength(len*q);
    tok.setAttribute('x',pt.x-5.5); tok.setAttribute('y',pt.y-4);
    if(q<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function render(){
  var s=STEPS[idx];
  var rooms=document.querySelectorAll('.rm');
  for(var i=0;i<rooms.length;i++){rooms[i].classList.remove('live','seen')}
  for(var j=0;j<idx;j++){
    for(var m=0;m<STEPS[j].room.length;m++){
      var el=map.querySelector('[data-room="'+STEPS[j].room[m]+'"]');
      if(el) el.classList.add('seen');
    }
  }
  for(var n=0;n<s.room.length;n++){
    var e2=map.querySelector('[data-room="'+s.room[n]+'"]');
    if(e2){e2.classList.remove('seen');e2.classList.add('live')}
  }
  var sts=document.querySelectorAll('.st');
  for(var q=0;q<sts.length;q++){
    sts[q].classList.toggle('live',q===idx);
    sts[q].classList.toggle('seen',q<idx);
  }
  document.getElementById('cur').textContent=idx+1;
  document.getElementById('curname').textContent=s.n+' · '+s.ko;
  document.getElementById('railfill').style.width=((idx+1)/STEPS.length*100)+'%';
  drawTrace();
}

function go(i,scroll){
  idx=(i+STEPS.length)%STEPS.length;
  render();
  if(scroll!==false){
    var el=document.querySelectorAll('.st')[idx];
    if(el) el.scrollIntoView({block:'nearest',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }
}

function setPlay(on){
  var b=document.getElementById('play');
  b.setAttribute('aria-pressed',on?'true':'false');
  b.textContent=on?'정지 STOP':'자동 재생 AUTO';
  if(timer){clearInterval(timer);timer=null}
  if(on) timer=setInterval(function(){go(idx+1)},3200);
}

buildList();
document.getElementById('prev').onclick=function(){setPlay(false);go(idx-1)};
document.getElementById('next').onclick=function(){setPlay(false);go(idx+1)};
document.getElementById('play').onclick=function(){setPlay(this.getAttribute('aria-pressed')!=='true')};
document.getElementById('print').onclick=function(){window.print()};

var rms=document.querySelectorAll('.rm');
for(var i=0;i<rms.length;i++){
  rms[i].addEventListener('click',function(){
    setPlay(false);
    var id=this.dataset.room;
    for(var k=1;k<=STEPS.length;k++){
      var c=(idx+k)%STEPS.length;
      if(STEPS[c].room.indexOf(id)>-1){go(c);return}
    }
  });
}

var lb=document.querySelectorAll('[data-lang]');
for(var L=0;L<lb.length;L++){
  lb[L].addEventListener('click',function(){
    for(var z=0;z<lb.length;z++) lb[z].setAttribute('aria-pressed','false');
    this.setAttribute('aria-pressed','true');
    document.body.className=this.dataset.lang;
    fixHeadings();
    drawTrace();
  });
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight'){e.preventDefault();setPlay(false);go(idx+1)}
  if(e.key==='ArrowLeft'){e.preventDefault();setPlay(false);go(idx-1)}
});

var rt;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(drawTrace,140)});
window.addEventListener('beforeprint',function(){setPlay(false)});

fixHeadings();
go(0,false);
</script>
